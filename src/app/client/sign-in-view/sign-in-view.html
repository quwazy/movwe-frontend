<div class="container mt-4">
  <h2>Sign In</h2>
  <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label>Username*</label>
      <input type="text" class="form-control" formControlName="username" />
      <div class="text-danger" *ngIf="signInForm.get('username')?.touched && signInForm.get('username')?.invalid">
        Username is required.
      </div>
    </div>

    <div class="mb-3">
      <label>Email*</label>
      <input type="email" class="form-control" formControlName="email" />
      <div class="text-danger" *ngIf="signInForm.get('email')?.touched && signInForm.get('email')?.invalid">
        Enter a valid email.
      </div>
    </div>

    <div class="mb-3">
      <label>Password*</label>
      <input type="password" class="form-control" formControlName="password" />
      <div class="text-danger" *ngIf="signInForm.get('password')?.touched && signInForm.get('password')?.invalid">
        Password must be at least 6 characters.
      </div>
    </div>

    <div class="mb-3">
      <label>Confirm Password*</label>
      <input type="password" class="form-control" formControlName="confirmPassword" />
      <div class="text-danger" *ngIf="passwordMismatch">
        Passwords do not match.
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="signInForm.invalid">
      Sign In
    </button>
  </form>
</div>
