<div>
  <div class="single-friend-container">
    <div class="friend-info">
      <img class="friend-avatar" src="/assets/default-user-avatar.jpg" />
      <span>{{ username }}</span>
    </div>
    <div>
      <button class="btn btn-primary me-2" (click)="onViewFriend()">View</button>
      <button class="btn btn-danger" (click)="onRemoveFriend()">Remove</button>
    </div>
  </div>
</div>
